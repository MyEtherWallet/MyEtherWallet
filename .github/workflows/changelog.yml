name: Update Changelog on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - feat/v7-develop

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v7-develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine entry type
        id: entry-type
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'

          if echo "$LABELS" | grep -qi '"fix"' || echo "$TITLE" | grep -qiE '^fix(\(.+\))?[!:]'; then
            echo "type=Fix" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -qi '"feat"' || echo "$TITLE" | grep -qiE '^feat(\(.+\))?[!:]'; then
            echo "type=Feat" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -qi '"chore"' || echo "$TITLE" | grep -qiE '^chore(\(.+\))?[!:]'; then
            echo "type=Chore" >> $GITHUB_OUTPUT
          else
            echo "type=Feat" >> $GITHUB_OUTPUT
          fi

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepend changelog entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ENTRY_TYPE: ${{ steps.entry-type.outputs.type }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ENTRY="- ${PR_TITLE} [#${PR_NUMBER}](${PR_URL})"

          # If the top of the changelog already has this version, inject under the right section.
          # Otherwise, prepend a new version block.
          FIRST_LINE=$(head -n 1 CHANGELOG.md)

          if echo "$FIRST_LINE" | grep -q "v${VERSION}"; then
            # Version block exists — find the section and append the entry beneath it
            python3 - <<EOF
          import re

          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          entry_type = '${ENTRY_TYPE}'
          entry = '${ENTRY}'

          section_header = f'# {entry_type}'
          version_header = f'### v${VERSION}'

          # Find version block
          version_pos = content.find(version_header)
          if version_pos == -1:
              # Fallback: prepend new block
              new_block = f'{version_header}\n\n# {entry_type}\n\n{entry}\n\n'
              content = new_block + content
          else:
              # Find section within version block
              next_version_pos = content.find('\n### v', version_pos + 1)
              version_block = content[version_pos:next_version_pos] if next_version_pos != -1 else content[version_pos:]

              if section_header in version_block:
                  # Append under existing section
                  section_pos = content.find(section_header, version_pos)
                  insert_pos = content.find('\n', section_pos) + 1
                  content = content[:insert_pos] + '\n' + entry + '\n' + content[insert_pos:]
              else:
                  # Add new section after version header line
                  header_end = content.find('\n', version_pos) + 1
                  content = content[:header_end] + '\n' + section_header + '\n\n' + entry + '\n' + content[header_end:]

          with open('CHANGELOG.md', 'w') as f:
              f.write(content)
          EOF
          else
            # New version block
            NEW_BLOCK="### v${VERSION}\n\n# ${ENTRY_TYPE}\n\n${ENTRY}\n\n"
            printf "%b" "$NEW_BLOCK" | cat - CHANGELOG.md > /tmp/CHANGELOG.tmp
            mv /tmp/CHANGELOG.tmp CHANGELOG.md
          fi

      - name: Commit and push to chore/generate-changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/generate-changelog"

          # Switch to the branch, creating it locally if it doesn't exist remotely
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            git checkout -b "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update changelog for #${{ github.event.pull_request.number }}"
          git push origin "$BRANCH"
